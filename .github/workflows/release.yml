name: Release build

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      file_exists: ${{ steps.checkfile.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check for publication-request.json
        id: checkfile
        run: |
          if [[ -f "publication-request.json" ]]; then
            echo "::set-output name=exists::true"
          else
            echo "::set-output name=exists::false"
          fi

  # Inlined copy of WorldHealthOrganization/smart-html/.github/workflows/release.yml@main
  # (as of db0851a) with the IG Publisher pinned to 2.3.4 — see step 3b.
  trigger:
    needs: check
    if: needs.check.outputs.file_exists == 'true'
    runs-on: ubuntu-latest
    steps:
      # ──────────────────────────────────────────────
      # 0. Disk diagnostics & cleanup (MUST be first)
      # ──────────────────────────────────────────────
      - name: "📊 Disk report: initial state"
        run: |
          echo "===== DISK FREE ====="
          df -h /
          echo ""
          echo "===== LARGEST DIRS UNDER /home/runner ====="
          du -sh /home/runner/actions-runner/cached/* 2>/dev/null | sort -rh | head -10 || true
          du -sh /home/runner/actions-runner/_work/* 2>/dev/null | sort -rh | head -10 || true
          echo ""
          echo "===== LARGEST DIRS UNDER /opt ====="
          du -sh /opt/* 2>/dev/null | sort -rh | head -10 || true
          echo ""
          echo "===== LARGEST DIRS UNDER /usr ====="
          du -sh /usr/* 2>/dev/null | sort -rh | head -5 || true

      - name: Emergency disk cleanup
        run: |
          # Runner logs from previous runs
          rm -rf /home/runner/actions-runner/cached/_diag/*.log 2>/dev/null || true
          rm -rf /tmp/* 2>/dev/null || true
          rm -rf $RUNNER_WORKSPACE/../_temp/* 2>/dev/null || true
          # Preinstalled toolchains we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          echo "===== DISK FREE AFTER CLEANUP ====="
          df -h /

      # ──────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "📊 Disk report: after checkout"
        run: |
          df -h /
          echo "Workspace: $(du -sh ${{ github.workspace }} | cut -f1)"

      - name: Use .github/release-config.yaml if present
        run: |
          if [ -f ".github/release-config.yaml" ] && [ ! -f "release-config.yaml" ]; then
            cp .github/release-config.yaml release-config.yaml
            echo "Using caller .github/release-config.yaml"
          fi

      # ──────────────────────────────────────────────
      # 2. Tool setup
      # ──────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "📊 Disk report: after Java"
        run: df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install SUSHI
        run: |
          npm install -g fsh-sushi
          sushi --version

      - name: "📊 Disk report: after Python/Node/SUSHI"
        run: df -h /

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          dot -V
          
      - name: Install Ruby & Jekyll
        run: |
          sudo apt-get install -y ruby-full build-essential zlib1g-dev
          gem install --no-document jekyll bundler --user-install
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> $GITHUB_PATH

      - name: Check Jekyll
        run: |
          jekyll -v
          bundle -v

      - name: "📊 Disk report: after all tool setup"
        run: df -h /

      # ──────────────────────────────────────────────
      # 3. Download CI tools (ig_publish.py + config)
      # ──────────────────────────────────────────────
      - name: Download scripts from smart-html
        run: |
          set -euxo pipefail
          REF="${{ github.workflow_ref }}"
          REF="${REF##*@}"
          mkdir -p .ci-tools
          curl -fsSL "https://raw.githubusercontent.com/WorldHealthOrganization/smart-html/refs/heads/main/scripts/ig_publisher.py" \
            -o .ci-tools/ig_publish.py
          curl -fsSL "https://raw.githubusercontent.com/WorldHealthOrganization/smart-html/refs/heads/main/scripts/requirements.txt" \
            -o .ci-tools/requirements.txt
          curl -fsSL "https://raw.githubusercontent.com/WorldHealthOrganization/smart-html/refs/heads/main/scripts/release-config.yaml" \
            -o .ci-tools/release-config.global.yaml
          chmod +x .ci-tools/ig_publish.py

      # ──────────────────────────────────────────────
      # 3b. Pin IG Publisher to 2.3.4 for the v1.7.4 release.
      #     3.0.0 crashes when publishing a milestone ("The folder
      #     .../output is not inside the website root folder ...");
      #     fixed upstream in HL7/fhir-ig-publisher@d64c08c but not yet
      #     released. ig_publish.py skips its own download when
      #     .ci-tools/publisher.jar already exists.
      # ──────────────────────────────────────────────
      - name: Pin IG Publisher 2.3.4
        run: |
          set -euxo pipefail
          curl -fsSL "https://github.com/HL7/fhir-ig-publisher/releases/download/2.3.4/publisher.jar" \
            -o .ci-tools/publisher.jar
          java -jar .ci-tools/publisher.jar -v || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r .ci-tools/requirements.txt

      # ──────────────────────────────────────────────
      # 4. Pre-SUSHI preprocessing
      #    (DAK generation, sushi-config update,
      #     DMN questionnaire & transform)
      # ──────────────────────────────────────────────
      - name: Download pre-sushi scripts
        run: |
          set -euxo pipefail
          mkdir -p input/scripts
          BASE_URL="https://raw.githubusercontent.com/WorldHealthOrganization/smart-ig-template/master/scripts/pre-sushi"
          for script in \
            1-generate_dak_from_sushi.py \
            2-update_sushi_config.py \
            3-dmn_questionnaire_generator.py \
            4-transform_dmn.py; do
            curl -L -f -o "input/scripts/${script}" "${BASE_URL}/${script}" 2>/dev/null \
              || echo "⚠  Failed to download ${script} (may not exist yet – continuing)"
          done

      - name: Run pre-sushi scripts
        run: |
          set -euo pipefail
          for script in \
            1-generate_dak_from_sushi.py \
            2-update_sushi_config.py \
            3-dmn_questionnaire_generator.py \
            4-transform_dmn.py; do
            if [[ -f "input/scripts/${script}" ]]; then
              echo "▶ Running ${script} …"
              python "input/scripts/${script}" || true
            fi
          done

      - name: "📊 Disk report: before ig_publish.py"
        run: |
          df -h /
          echo "Workspace: $(du -sh ${{ github.workspace }} | cut -f1)"

      # ──────────────────────────────────────────────
      # 5. Build & publish via ig_publish.py
      # ──────────────────────────────────────────────
      - name: Build & publish (Python drives gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euxo pipefail
          python .ci-tools/ig_publish.py \
            --global-config ".ci-tools/release-config.global.yaml" \
            --local-config "release-config.yaml" \
            --source "${{ github.workspace }}" \
            --webroot-repo "https://github.com/WorldHealthOrganization/smart-html" \
            --registry-repo "https://github.com/FHIR/ig-registry" \
            --ensure-pubreq \
            --pubreq-package-id "" \
            --pubreq-version "" \
            --pubreq-canonical "" \
            --pubreq-path "" \
            --publish-gh-pages \
            --sitepreview-dir "sitepreview" \
            --enable-pr \
            --github-token "${{ secrets.GITHUB_TOKEN }}"

      # ──────────────────────────────────────────────
      # 6. Final disk report (runs even on failure)
      # ──────────────────────────────────────────────
      - name: "📊 Disk report: final state"
        if: always()
        run: |
          echo "===== DISK FREE ====="
          df -h /
          echo ""
          echo "===== LARGEST DIRS UNDER WORKSPACE ====="
          du -sh ${{ github.workspace }}/* 2>/dev/null | sort -rh | head -15 || true
          echo ""
          echo "===== LARGEST DIRS UNDER /home/runner ====="
          du -sh /home/runner/actions-runner/_work/* 2>/dev/null | sort -rh | head -10 || true
